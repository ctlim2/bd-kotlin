compose-material-icons-extended-lib = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
